name: CI

# Comprueba en cada cambio lo mismo que corre un colaborador en su maquina.
# El repositorio no tenia ninguna comprobacion automatica, y en dos ocasiones un
# cambio rompio algo que nadie noto hasta mucho despues: la interfaz entera se
# quedo invisible, y la clasificacion de hojas de vida se cayo de 73,9% a 19,6%
# con las pruebas en verde.
on:
  push:
    branches: [main]
  pull_request:

# Un solo trabajo en vuelo por rama: al empujar de nuevo se cancela el anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # `npm run typecheck` usa `tsc -b`, que es lo que comprueba de verdad el
      # proyecto: el tsconfig raiz solo tiene referencias, asi que `tsc --noEmit`
      # a secas no revisaba ni un archivo.
      - name: Comprobar tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build de produccion
        run: npm run build

  banco:
    name: Banco del lector (perfil limpio)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # Los escaneos no se versionan (son 22 MB de JPEG); el generador los
      # reproduce identicos, porque el degradado va con semilla.
      - name: Generar los escaneos
        run: npm run gen:scans

      # Solo el perfil limpio: 13 de los 40 documentos, poco mas de un minuto.
      # No es la medida completa, es una verja. Los umbrales van con holgura
      # sobre lo medido (84,3% y 4,5 s por documento el 5 de septiembre de 2026)
      # para que no salte por el ruido del runner, pero cierran el paso a las dos
      # formas en que este motor se ha degradado: leer peor y, sobre todo, anadir
      # pasadas de OCR automaticas que multiplican el tiempo sin ganar precision.
      - name: Medir el perfil limpio
        run: npm run copy:ocr && node scripts/bench-ocr.mjs limpio --precision-minima=78 --ms-maximos=9000

      # El perfil medio (fotocopia) es donde antes se vio el desbordamiento de
      # tiempo: 15 documentos, medidos en 83,9% y 8,9 s el 5 de septiembre.
      - name: Medir el perfil medio
        run: node scripts/bench-ocr.mjs medio --precision-minima=78 --ms-maximos=15000

# La medida COMPLETA (`npm run bench:ocr`, los 40 escaneos y los 12 contratos)
# no entra aqui: tarda demasiado. Se corre a mano antes de tocar el motor, y es
# obligatoria para cualquier cambio del lector. Como hacerlo, en
# docs/MEDICION_LECTOR.md.
